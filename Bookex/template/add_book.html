{% extends 'base.html' %}
{% if messages %}
        {% for message in messages %}
         {% if message.tags %}  <script>alert("{{ message }}")</script> {% endif %}

        {% endfor %}

    {% endif %}

{% block content %}
  <div class="container mt-4">
    <h1 class="mb-4">Add a Book</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="mb-3">
        <label for="{{ form.name.id_for_label }}" class="form-label">Book Name:</label>
        {{ form.name }}
      </div>

      <div class="mb-3">
        <label for="{{ form.author.id_for_label }}" class="form-label">Author:</label>
        {{ form.author }}
      </div>

      <div class="mb-3">
        <label for="{{ form.language.id_for_label }}" class="form-label">Language:</label>
        {{ form.language }}
      </div>

      <div class="mb-3">
        <label for="{{ form.image.id_for_label }}" class="form-label">Book Cover:</label>
        {{ form.image }}
      </div>

      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
{% endblock %}
