{% extends "base.html" %}

{% load static %}
{% block content %}
<body>


    <!-- Book Details Section -->
    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h2>Book Details</h2>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <img src="{{ book.image.url }}" alt="{{ book.name }}" class="img-fluid">
                    </div>
                    <div class="col-md-8">
                        <p><strong>Title:</strong> {{ book.name }}</p>
                        <p><strong>Language:</strong> {{ book.author }}</p>
                        <p><strong>Language:</strong> {{ book.language }}</p>
                        <!-- Add more book details as needed -->
                        <a class="btn btn-primary btn-lg px-4 gap-3" href="{% url 'exchange' book.id%}" role="button">exchange</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and jQuery (optional, for Bootstrap components) -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>

</body>
{% endblock %}
