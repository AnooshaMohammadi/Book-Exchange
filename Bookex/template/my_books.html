{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/livecanvas-team/ninjabootstrap/dist/css/bootstrap.min.css" media="all">


<div class="container">

<br>
    <div class="row">
      {% for book in book_list %}
        {% if book.owner.id == user.id %}
      <div class="col-md-4 mb-4">
        <div class="card h-100">
          {% if book.image %}
          <img src="{{ book.image.url }}" class="card-img-top" alt="{{ book.title }}" style="height: 200px; object-fit: cover;"> <!-- Adjusted image style -->
          {% else %}
          <img src="{% static 'noimage.jpg' %}" class="card-img-top" alt="{{ book.name }}" style="height: 200px; object-fit: cover;"> <!-- Adjusted image style -->
          {% endif %}
          <div class="card-body d-flex flex-column">
            <div>
              <h5 class="card-title text-truncate">{{ book.name }}</h5>
              <h5 class="card-text" style="text-align:center">{{ book.author }}</h5>
            </div>
             </div>
          </div>
        </div><!-- Adjusted button class for consistency -->
          {% endif %}

     {% endfor %}
    </div>
</div>
{% endblock content%}
